<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Todo List</title>
<style>
:root{--bg:#eef3f1;--ink:#1d2b28;--muted:#5f7570;--card:#fff;--line:#d3dedb;--accent:#1f7a6a;--danger:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#141c1a;--ink:#e6efec;--muted:#93a9a3;--card:#1e2926;--line:#2f3f3b;--accent:#4fc4ad;--danger:#e07a67}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:520px}
h1{font-size:2rem;margin:0 0 4px}
#count{color:var(--muted);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.9rem}
.row{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-family:system-ui,sans-serif}
button{font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;border-radius:8px;border:none}
.add{background:var(--accent);color:#fff;padding:0 18px;font-weight:600}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filters button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 12px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;padding:0;margin:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.del{background:transparent;color:var(--danger);padding:4px 8px}
.edit{background:transparent;color:var(--accent);padding:4px 8px}
.editbox{flex:1;padding:6px 8px;font-size:1rem;border:1px solid var(--accent);border-radius:6px;background:var(--card);color:var(--ink);font-family:system-ui,sans-serif}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-style:italic}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>My Todo List</h1>
  <p id="count"></p>
  <div class="row" id="f">
    <input type="text" id="t" placeholder="Add a task" aria-label="New task" autocomplete="off">
    <button class="add" type="button" id="addBtn">Add task</button>
  </div>
  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="active">Active</button>
    <button data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
</main>
<script>
let todos=[],filter="all";
try{todos=JSON.parse(localStorage.getItem("todos")||"[]")}catch(e){todos=[]}
const save=()=>{try{localStorage.setItem("todos",JSON.stringify(todos))}catch(e){}};
const list=document.getElementById("list"),count=document.getElementById("count");
function render(){
  const shown=todos.filter(t=>filter==="all"||(filter==="done")===t.done);
  list.innerHTML="";
  if(!shown.length){list.innerHTML='<li class="empty" style="justify-content:center;border:none;background:none">Nothing here yet. Add your first task.</li>'}
  shown.forEach(t=>{
    const li=document.createElement("li");if(t.done)li.className="done";
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=t.done;cb.setAttribute("aria-label","Mark done");
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    const s=document.createElement("span");s.textContent=t.text;
    const d=document.createElement("button");d.className="del";d.textContent="Delete";
    d.onclick=()=>{todos=todos.filter(x=>x!==t);save();render()};
    // Edit button: swaps the text for an input box
    const ed=document.createElement("button");ed.className="edit";ed.textContent="Edit";
    ed.onclick=()=>{
      const box=document.createElement("input");box.type="text";box.value=t.text;box.className="editbox";box.setAttribute("aria-label","Edit task");
      let finished=false;
      const finish=ok=>{
        if(finished)return;finished=true;
        const v=box.value.trim();
        if(ok&&v)t.text=v;
        save();render();
      };
      box.addEventListener("keydown",e=>{if(e.key==="Enter")finish(true);if(e.key==="Escape")finish(false)});
      box.addEventListener("blur",()=>finish(true));
      li.replaceChild(box,s);ed.textContent="Save";ed.onclick=()=>finish(true);
      box.focus();
    };
    li.append(cb,s,ed,d);list.append(li);
  });
  const left=todos.filter(t=>!t.done).length;
  count.textContent=left+" task"+(left===1?"":"s")+" left";
}
function addTodo(){
  const i=document.getElementById("t"),v=i.value.trim();
  if(!v)return;
  todos.push({text:v,done:false});i.value="";save();render();
}
document.getElementById("addBtn").addEventListener("click",addTodo);
document.getElementById("t").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTodo()}});
document.getElementById("filters").onclick=e=>{
  if(!e.target.dataset.f)return;
  filter=e.target.dataset.f;
  document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("on",b===e.target));
  render();
};
render();
</script>
</body>
</html>
